[project]
name = "al-router"
version = "0.1.0"
description = "Active Learning Data Router for Edge-Case Mining (M29)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.1.0",
    "opencv-python>=4.9.0.80",
    "numpy>=1.26.4",
    "tqdm>=4.66.2",
    "pydantic>=2.6.4",
    "matplotlib>=3.8.3",
    "click>=8.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
al_router = "src.cli:main"
